<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Ti ❤️</title>

<style>
body {
    margin: 0;
    padding: 0;
    overflow-x: hidden;
    font-family: 'Georgia', serif;
    background: radial-gradient(circle at top, #1a1a2e, #0f3460, #000);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    color: white;
}

/* Nombre brillante */
.love-title {
    font-size: 26px;
    font-weight: bold;
    background: linear-gradient(90deg, #ff4e50, #f9d423, #ff4e50);
    background-size: 200% auto;
    color: transparent;
    -webkit-background-clip: text;
    animation: shine 3s linear infinite;
    margin-bottom: 10px;
}

@keyframes shine {
    to { background-position: 200% center; }
}

/* Corazones flotando */
.heart {
    position: absolute;
    color: rgba(255, 0, 100, 0.8);
    animation: float 6s linear infinite;
    font-size: 20px;
}

@keyframes float {
    0% {transform: translateY(100vh) scale(1);}
    100% {transform: translateY(-10vh) scale(1.5);}
}

.card {
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(15px);
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    text-align: center;
    max-width: 420px;
    animation: fadeIn 2s ease-in-out;
    position: relative;
    z-index: 10;
}

.card img {
    width: 70%;
    max-height: 250px;
    object-fit: cover;
    border-radius: 20px;
    display: block;
    margin: 0 auto 15px auto;
}

h1 {
    color: #fff;
}

p {
    font-size: 18px;
    line-height: 1.5;
}

.buttons {
    margin-top: 20px;
    position: relative;
}

button {
    padding: 10px 20px;
    border: none;
    border-radius: 25px;
    font-size: 16px;
    cursor: pointer;
    margin: 5px;
}

#yesBtn {
    background-color: #ff4e50;
    color: white;
}

#noBtn {
    background-color: gray;
    color: white;
    position: absolute;
}

@keyframes fadeIn {
    from {opacity: 0; transform: translateY(20px);}
    to {opacity: 1; transform: translateY(0);}
}
</style>
</head>

<body>

<div class="card">
    <div class="love-title">Genesis ❤️ Julian</div>

    <img src="https://i.imgur.com/Kqov69Y.jpeg" alt="Nuestra Foto">

    <h1>Feliz 14 de Febrero ❤️</h1>
    <p>
        Desde que estás en mi vida todo es más bonito.  
        Quiero seguir construyendo recuerdos contigo y celebrar este día juntos.
    </p>

    <div class="buttons">
        <button id="yesBtn">Sí 💕</button>
        <button id="noBtn">No 😢</button>
    </div>
</div>

<script>
// Corazones flotando
function createHeart() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = Math.random() * 20 + 15 + "px";
    heart.style.animationDuration = Math.random() * 3 + 3 + "s";
    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 6000);
}
setInterval(createHeart, 300);

// Botón que se escapa
const noBtn = document.getElementById("noBtn");
noBtn.addEventListener("mouseover", () => {
    const x = Math.random() * 300 - 150;
    const y = Math.random() * 200 - 100;
    noBtn.style.transform = `translate(${x}px, ${y}px)`;
});

// Explosión de corazones
function explosion() {
    for (let i = 0; i < 40; i++) {
        const heart = document.createElement("div");
        heart.innerHTML = "💖";
        heart.style.position = "absolute";
        heart.style.left = "50%";
        heart.style.top = "50%";
        heart.style.fontSize = "20px";
        heart.style.transform = `translate(-50%, -50%)`;
        document.body.appendChild(heart);

        const x = (Math.random() - 0.5) * 600;
        const y = (Math.random() - 0.5) * 600;

        heart.animate([
            { transform: "translate(-50%, -50%)", opacity: 1 },
            { transform: `translate(${x}px, ${y}px)`, opacity: 0 }
        ], {
            duration: 1500,
            easing: "ease-out"
        });

        setTimeout(() => heart.remove(), 1500);
    }
}

// Botón sí
const yesBtn = document.getElementById("yesBtn");
yesBtn.addEventListener("click", () => {

    explosion();

    setTimeout(() => {
        document.body.innerHTML = `
            <div style="text-align:center; padding:40px;">
                <h1 style="font-size:40px;">Te Amo Genesis ❤️</h1>
                <p style="font-size:22px; max-width:600px; margin:auto;">
                    Se que no soy la persona mas romantica que exista, ni la que te llene de amor, pero me esforzare para llenarte de detalles como estos que llenen tu corazon
                </p>
            </div>
        `;
    }, 1000);
});
</script>

</body>
</html>
